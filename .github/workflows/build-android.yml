name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/terminal-protocol-architecture-CSF3f

jobs:
  build:
    name: EAS Build — Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Print download URL
        run: |
          echo "✅ Build complete. Download your APK from:"
          eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null \
            | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'] if builds else 'Check expo.dev/builds')" \
            || echo "→ https://expo.dev/accounts/[your-username]/projects/terminal-protocol/builds"
