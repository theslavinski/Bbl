name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/terminal-protocol-architecture-CSF3f

jobs:
  build:
    name: Gradle Local Build — Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild (generate Android project)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-protocol-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
